<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Студия здоровья</title>
</head>
<body>
    <div class="register-card">
        <h1>Регистрация</h1>

        <div class="error-message" id="errorMessage" style="display: none;"></div>
        <div class="success-message" id="successMessage" style="display: none;"></div>

        <div class="input-group">
            <input type="text" id="login" placeholder="Логин" autocomplete="username">
        </div>

        <div class="input-group">
            <input type="email" id="email" placeholder="Email" autocomplete="email">
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="Пароль" autocomplete="new-password">
        </div>

        <div class="input-group">
            <input type="password" id="confirm_password" placeholder="Подтвердите пароль" autocomplete="new-password">
        </div>

        <button class="register-btn" onclick="handleRegistration()">ЗАРЕГИСТРИРОВАТЬСЯ</button>
        
        <div class="login-redirect">
            <a href="entrance.html">Уже есть аккаунт? Войти</a>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
